[package]
name = "aubri"
version = "0.2.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
cpal = "0.17.3"
rand = "0.10.1"
blake3 = "1.8.5"
bytemuck = { version = "1.25.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
rpassword = "7.5.3"

# OpenGL ("glow") is universally supported.
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }