[package]
name = "aubri"
version = "0.2.0"
edition = "2024"
authors = ["Lucian BLETAN <neuraluc@gmail.com>"]
description = "Encrypted P2P audio bridge for Linux"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/aubri"
homepage = "https://github.com/gni/aubri"
repository = "https://github.com/gni/aubri"
categories = ["command-line-utilities", "development-tools"]
keywords = ["audio", "bridge", "udp", "p2p", "tcp"]

[features]
default = []
gui = ["eframe"]

[dependencies]
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
cpal = "0.17.3"
rand = "0.10.1"
blake3 = "1.8.5"
bytemuck = { version = "1.25.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rpassword = "7.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# optional dependencies for the visual diagnostic suite
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }